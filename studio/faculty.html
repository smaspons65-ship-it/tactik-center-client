<title>TACTIK Faculty Studio</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* Layout: a two-pane console. A quiet rail of seven workspaces beside one wide
     working column. Refusals are the only loud color on the page. */
  :root {
    --ground:      #F3F4F8;
    --surface:     #FFFFFF;
    --surface-alt: #EAEDF3;
    --ink:         #14203A;
    --ink-soft:    #3D4A66;
    --muted:       #66718C;
    --rule:        #DCE0E9;
    --rule-strong: #C3CAD8;
    --crimson:     #9E1B22;
    --crimson-wash:#F7EAEA;
    --green:       #14624E;
    --green-wash:  #E4EFEA;
    --amber:       #855400;
    --amber-wash:  #FAF0DA;
    --focus:       #2F5BD3;

    --display: Spectral, Georgia, "Times New Roman", serif;
    --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

    --step--1: 0.8125rem;
    --step-0: 0.9375rem;
    --step-1: 1.0625rem;
    --step-2: 1.375rem;
    --step-3: 1.875rem;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #0D1320;
      --surface:     #141C2C;
      --surface-alt: #1B2437;
      --ink:         #E7EBF3;
      --ink-soft:    #BAC3D4;
      --muted:       #8D99B1;
      --rule:        #262F45;
      --rule-strong: #35405B;
      --crimson:     #E8777C;
      --crimson-wash:#2B1A1F;
      --green:       #5BC0A0;
      --green-wash:  #11251F;
      --amber:       #E2B45E;
      --amber-wash:  #2A2213;
      --focus:       #8DA9FF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground:      #0D1320;
    --surface:     #141C2C;
    --surface-alt: #1B2437;
    --ink:         #E7EBF3;
    --ink-soft:    #BAC3D4;
    --muted:       #8D99B1;
    --rule:        #262F45;
    --rule-strong: #35405B;
    --crimson:     #E8777C;
    --crimson-wash:#2B1A1F;
    --green:       #5BC0A0;
    --green-wash:  #11251F;
    --amber:       #E2B45E;
    --amber-wash:  #2A2213;
    --focus:       #8DA9FF;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--ground); }
  body {
    color: var(--ink);
    font-family: var(--body);
    font-size: var(--step-0);
    line-height: 1.55;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .shell {
    display: grid;
    grid-template-columns: 15rem minmax(0, 1fr);
    min-height: 100%;
  }
  .rail {
    border-right: 1px solid var(--rule);
    background: var(--surface);
    padding: 1.5rem 0.75rem 2rem;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  .brand { padding: 0 0.5rem; }
  .brand__eyebrow {
    font-size: 0.6875rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .brand__name {
    font-family: var(--display); font-weight: 600; font-size: var(--step-2);
    line-height: 1.15; margin-top: 0.15rem;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
    text-align: left; border: 0; background: transparent; cursor: pointer;
    padding: 0.5rem 0.6rem; border-radius: var(--radius); color: var(--ink-soft);
    font-weight: 500;
  }
  .nav button:hover { background: var(--surface-alt); color: var(--ink); }
  .nav button[aria-current="page"] { background: var(--ink); color: var(--surface); }
  .nav .count {
    font-size: 0.6875rem; font-variant-numeric: tabular-nums; font-weight: 600;
    padding: 0.05rem 0.4rem; border-radius: 999px; background: var(--surface-alt); color: var(--ink-soft);
  }
  .nav button[aria-current="page"] .count { background: rgba(127,127,127,0.25); color: inherit; }
  .nav .count--warn { background: var(--amber-wash); color: var(--amber); }
  .nav .count--bad { background: var(--crimson-wash); color: var(--crimson); }
  .nav .count--ok { background: var(--green-wash); color: var(--green); }
  .actor { padding: 0 0.5rem; display: grid; gap: 0.3rem; }
  .actor label { font-size: var(--step--1); color: var(--muted); }
  .rail__foot { margin-top: auto; padding: 0 0.5rem; font-size: var(--step--1); color: var(--muted); }

  main { min-width: 0; padding-block: 0 4rem; padding-inline: clamp(1rem, 3.5vw, 2.75rem); }
  .banner {
    margin: 0 calc(-1 * clamp(1rem, 3.5vw, 2.75rem)) 1.75rem;
    padding: 0.55rem clamp(1rem, 3.5vw, 2.75rem);
    background: var(--amber-wash); color: var(--amber);
    border-bottom: 1px solid var(--rule);
    font-size: var(--step--1); font-weight: 500;
  }
  .banner strong { letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.6875rem; margin-right: 0.5rem; }
  .alarm {
    margin-bottom: 1.25rem; padding: 0.75rem 1rem; border: 1px solid var(--crimson);
    background: var(--crimson-wash); color: var(--crimson); border-radius: var(--radius);
  }

  .view { max-width: 68rem; display: grid; gap: 2rem; }
  .vhead { display: grid; gap: 0.35rem; max-width: 70ch; }
  .vhead__eyebrow { font-size: 0.6875rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 { font-family: var(--display); font-weight: 600; font-size: var(--step-3); line-height: 1.12; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--display); font-weight: 600; font-size: var(--step-2); line-height: 1.2; margin: 0; text-wrap: balance; }
  h3 { font-size: var(--step-1); font-weight: 600; margin: 0; }
  p { margin: 0; }
  .lede { color: var(--ink-soft); }
  .muted { color: var(--muted); }
  .small { font-size: var(--step--1); }
  .mono { font-family: var(--mono); font-size: 0.8125rem; word-break: break-all; }

  .section { display: grid; gap: 0.9rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
  .section__head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.5rem 1rem; }
  .section__note { color: var(--muted); font-size: var(--step--1); max-width: 70ch; }

  .panel {
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 1rem 1.1rem; display: grid; gap: 0.75rem; min-width: 0;
  }
  .panel--status { border-color: var(--rule-strong); }
  .refusal {
    border: 1px solid var(--crimson); background: var(--crimson-wash); color: var(--ink);
    border-radius: var(--radius); padding: 0.9rem 1rem; display: grid; gap: 0.5rem;
  }
  .refusal__title { color: var(--crimson); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.75rem; }
  .ok-box {
    border: 1px solid var(--green); background: var(--green-wash); border-radius: var(--radius);
    padding: 0.9rem 1rem; display: grid; gap: 0.4rem;
  }
  .ok-box__title { color: var(--green); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.75rem; }

  .row { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: center; }
  .stack { display: grid; gap: 0.6rem; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
  .split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1rem; align-items: start; }

  .pill {
    display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap;
    font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.15rem 0.5rem; border-radius: 999px; border: 1px solid var(--rule-strong); color: var(--ink-soft);
  }
  .pill--draft { background: var(--amber-wash); color: var(--amber); border-color: transparent; }
  .pill--ok { background: var(--green-wash); color: var(--green); border-color: transparent; }
  .pill--bad { background: var(--crimson-wash); color: var(--crimson); border-color: transparent; }
  .pill--ink { background: var(--ink); color: var(--surface); border-color: transparent; }
  .pill--hollow { border-style: dashed; }

  .btn {
    border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink);
    padding: 0.4rem 0.8rem; border-radius: var(--radius); cursor: pointer; font-weight: 500;
    font-size: var(--step--1); line-height: 1.4;
  }
  .btn:hover:not(:disabled) { border-color: var(--ink-soft); }
  .btn--primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .btn--primary:hover:not(:disabled) { opacity: 0.9; }
  .btn--danger { color: var(--crimson); border-color: var(--crimson); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  label.field { display: grid; gap: 0.3rem; min-width: 0; }
  label.field > span { font-size: var(--step--1); color: var(--muted); font-weight: 500; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%; border: 1px solid var(--rule-strong); border-radius: var(--radius);
    background: var(--surface); padding: 0.45rem 0.6rem; min-width: 0;
  }
  textarea { resize: vertical; min-height: 2.6rem; line-height: 1.45; }
  input:disabled, select:disabled, textarea:disabled { background: var(--surface-alt); color: var(--ink-soft); }
  input[type="range"] { width: 100%; accent-color: var(--ink); }

  .tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
  th, td { text-align: left; vertical-align: top; padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--rule); }
  th { font-weight: 600; color: var(--muted); font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; background: var(--surface-alt); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { font-variant-numeric: tabular-nums; text-align: right; }

  .q { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 0.6rem 0.9rem; align-items: start; padding: 0.8rem 0; border-bottom: 1px solid var(--rule); }
  .q:last-child { border-bottom: 0; }
  .q__meta { display: grid; gap: 0.25rem; font-size: var(--step--1); }
  .q__id { font-family: var(--mono); font-weight: 500; }
  .q__actions { display: grid; gap: 0.35rem; justify-items: end; }

  .cell {
    width: 100%; border: 1px solid var(--rule); background: var(--surface); border-radius: var(--radius);
    padding: 0.35rem 0.5rem; cursor: pointer; text-align: left; display: grid; gap: 0.1rem; min-width: 7.5rem;
  }
  .cell:hover { border-color: var(--ink-soft); }
  .cell[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .cell__lvl { font-variant-numeric: tabular-nums; font-weight: 600; }
  .cell--und { border-style: dashed; color: var(--ink-soft); }
  .lvl-0 .cell__lvl { color: var(--crimson); }
  .lvl-1 .cell__lvl { color: var(--amber); }
  .lvl-2 .cell__lvl, .lvl-3 .cell__lvl { color: var(--green); }
  .noscore { color: var(--muted); font-style: italic; }

  .turn { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0.25rem 0.9rem; padding: 0.55rem 0; }
  .turn__who { font-size: var(--step--1); color: var(--muted); font-weight: 600; }
  .turn--candidate .turn__text { background: var(--surface-alt); border-radius: var(--radius); padding: 0.45rem 0.65rem; }
  .turn--rule .turn__text { border-left: 2px solid var(--ink-soft); padding-left: 0.65rem; color: var(--ink-soft); }
  .turn--blocked .turn__text { color: var(--crimson); font-weight: 500; }
  .state-head { padding-top: 1.1rem; display: flex; flex-wrap: wrap; gap: 0.4rem 0.8rem; align-items: baseline; }
  .state-head h3 { font-family: var(--display); font-size: var(--step-1); }

  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.3rem 1rem; font-size: var(--step--1); }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; min-width: 0; }
  ul.plain { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.25rem; }
  code { font-family: var(--mono); font-size: 0.8125rem; background: var(--surface-alt); padding: 0.05rem 0.3rem; border-radius: 4px; }
  pre.cmd { margin: 0; font-family: var(--mono); font-size: 0.8125rem; background: var(--surface-alt); padding: 0.7rem 0.85rem; border-radius: var(--radius); overflow-x: auto; }
  details > summary { cursor: pointer; font-weight: 500; }
  .stat { display: grid; gap: 0.1rem; }
  .stat__n { font-family: var(--display); font-size: var(--step-2); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat__l { font-size: var(--step--1); color: var(--muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 1.25rem 2.25rem; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail {
      position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto;
      flex-direction: column; gap: 0.6rem; padding: 0.7rem 1rem; border-right: 0; border-bottom: 1px solid var(--rule);
    }
    .brand { display: flex; align-items: baseline; gap: 0.6rem; padding: 0; }
    .brand__name { font-size: var(--step-1); margin: 0; }
    .nav { flex-direction: row; overflow-x: auto; gap: 0.25rem; padding-bottom: 0.15rem; }
    .nav button { flex: 0 0 auto; padding: 0.35rem 0.6rem; }
    .actor, .rail__foot { display: none; }
    .grid2, .grid3, .split { grid-template-columns: minmax(0, 1fr); }
    .q { grid-template-columns: minmax(0, 1fr); }
    .q__actions { justify-items: start; grid-auto-flow: column; justify-content: start; }
    .turn { grid-template-columns: minmax(0, 1fr); }
  }
</style>

<div class="shell">
  <aside class="rail" aria-label="Studio navigation">
    <div class="brand">
      <div class="brand__eyebrow">TACTIK EDU</div>
      <div class="brand__name">Faculty Studio</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="actor">
      <label for="actor">Acting as</label>
      <input type="text" id="actor" autocomplete="off">
      <span class="small muted">Approvals and overrides carry this name. There is no sign-in in this demo.</span>
    </div>
    <div class="rail__foot">Fictional data. Runs in this browser. No AI model is called.</div>
  </aside>
  <main>
    <div class="banner"><strong>Demo</strong>Fictional institution, course, dossier and candidates. Nothing here is an academic record. Everything stays in this browser.</div>
    <div id="alarm"></div>
    <div id="view"></div>
  </main>
</div>

<script id="studio-core">
/* TACTIK EDU Faculty Studio, core. No DOM, no network, no randomness except
   content salts. Answerable to docs/HASHING.md and docs/WEBSCRIPT.md, and run
   by tests/test_studio.py under Node against the Python implementation. */
(function (root) {
  "use strict";

  // ---------- SHA-256 (FIPS 180-4), synchronous, UTF-8 input ----------
  const K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
  ];
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));

  function sha256Hex(text) {
    const bytes = new TextEncoder().encode(text);
    const length = bytes.length;
    const padded = new Uint8Array(((length + 9 + 63) >> 6) << 6);
    padded.set(bytes);
    padded[length] = 0x80;
    const view = new DataView(padded.buffer);
    view.setUint32(padded.length - 8, Math.floor(length / 0x20000000));
    view.setUint32(padded.length - 4, (length << 3) >>> 0);
    const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const w = new Uint32Array(64);
    for (let offset = 0; offset < padded.length; offset += 64) {
      for (let i = 0; i < 16; i++) w[i] = view.getUint32(offset + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    return H.map((x) => x.toString(16).padStart(8, "0")).join("");
  }

  // ---------- canonical form (docs/HASHING.md) ----------
  function canonical(value, path = "$") {
    if (value === null) return "null";
    const type = typeof value;
    if (type === "boolean") return value ? "true" : "false";
    if (type === "number") {
      if (!Number.isInteger(value)) {
        throw new Error(`${path}: float values are not hashable in this record; use an integer or a decimal string`);
      }
      if (!Number.isSafeInteger(value)) throw new Error(`${path}: integer ${value} exceeds exact range`);
      return String(value);
    }
    if (type === "string") return JSON.stringify(value);
    if (Array.isArray(value)) return `[${value.map((item, i) => canonical(item, `${path}[${i}]`)).join(",")}]`;
    if (type === "object") {
      const keys = Object.keys(value).sort();
      return `{${keys.map((key) => `${JSON.stringify(key)}:${canonical(value[key], `${path}.${key}`)}`).join(",")}}`;
    }
    throw new Error(`${path}: ${type} is not serializable`);
  }
  const digest = (value) => sha256Hex(canonical(value));

  // ---------- append-only ledger (tactik_eval/record.py semantics) ----------
  const GENESIS = "0".repeat(64);
  const headOf = (ledger) => (ledger.entries.length ? ledger.entries[ledger.entries.length - 1].link : GENESIS);
  const linkOf = (e) => digest({ index: e.index, kind: e.kind, body: e.body, previous: e.previous });
  const contentHashOf = (e) => digest({ kind: e.kind, body: e.body });

  function appendEntry(ledger, kind, body) {
    if (typeof kind !== "string" || !kind.trim()) throw new Error("an entry requires a kind");
    if (kind === "withdrawal") throw new Error("the studio never writes withdrawals; tactik_eval reserves that kind");
    const entry = { index: ledger.entries.length, kind, body, previous: headOf(ledger) };
    entry.link = linkOf(entry);
    ledger.entries.push(entry);
    return entry;
  }

  function ledgerPayload(ledger) {
    return {
      head: headOf(ledger),
      entries: ledger.entries.map((e) => ({ index: e.index, kind: e.kind, body: e.body, previous: e.previous, link: e.link })),
    };
  }

  function verifyLedgerPayload(payload) {
    const problems = [];
    const entries = Array.isArray(payload && payload.entries) ? payload.entries : [];
    let previous = GENESIS;
    entries.forEach((entry, position) => {
      if (entry.index !== position) problems.push(`entry at position ${position} claims index ${entry.index}`);
      if (entry.previous !== previous) problems.push(`entry ${position} breaks the chain`);
      let recomputed = null;
      try { recomputed = linkOf(entry); } catch (err) { problems.push(`entry ${position}: ${err.message}`); }
      if (recomputed !== entry.link) problems.push(`entry ${position} link mismatch`);
      previous = recomputed || "";
    });
    const recordedHead = payload && payload.head !== undefined ? payload.head : GENESIS;
    if (recordedHead !== previous) problems.push("head mismatch");
    return { ok: problems.length === 0, problems, head: previous, count: entries.length };
  }

  // ---------- content store: candidate text never enters an entry body ----------
  function randomSalt() {
    const bytes = new Uint8Array(16);
    root.crypto.getRandomValues(bytes);
    return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
  }
  function storeContent(store, text) {
    const salt = randomSalt();
    const ref = digest({ salt, text });
    store[ref] = { salt, text };
    return ref;
  }

  // ---------- Webscript gates (docs/WEBSCRIPT.md) ----------
  const FORMAT = "tactik-edu/webscript@1";
  const SYSTEM = "system";
  const WEIGHT_TOTAL_BP = 10000;
  const MANDATORY_EVENTS = ["unsupported_claim", "high_confidence_low_evidence", "self_correction", "evasion_repeat", "answer_request"];
  const MANDATORY_STOPS = ["participant_requests_stop", "restricted_information", "departs_from_approved_scope", "generates_student_work", "faculty_concern"];
  const isBlank = (s) => typeof s !== "string" || !s.trim();

  function lockBlockers(ws) {
    const out = [];
    const add = (code, detail) => out.push({ code, detail });
    const o = ws.objective;
    if (isBlank(o.target)) add("OBJECTIVE_INCOMPLETE", "objective target is blank");
    if (isBlank(o.floor)) add("OBJECTIVE_INCOMPLETE", "objective floor is blank");
    if (!o.must_not_happen.some((c) => !isBlank(c))) add("OBJECTIVE_INCOMPLETE", "objective must_not_happen is blank");

    const lensKeys = new Set(ws.lenses.map((l) => l.key));
    const states = new Map(ws.states.map((s) => [s.key, s]));
    const n = ws.states.length;
    if (!n || ws.states[0].owner !== SYSTEM || ws.states[n - 1].owner !== SYSTEM) {
      add("STATES_UNBOUNDED", "the first and last states must be system-owned (orientation and debrief); a session must not wander");
    }
    for (const s of ws.states) {
      if (s.owner !== SYSTEM && !lensKeys.has(s.owner)) add("STATE_OWNER_UNKNOWN", `${s.key} is owned by unknown '${s.owner}'`);
      if (isBlank(s.goal) || isBlank(s.exit)) add("STATE_INCOMPLETE", `${s.key} needs a goal and an exit condition`);
    }
    const defined = new Map(ws.pressure_levels.map((p) => [p.level, p.definition]));
    for (const level of [1, 2, 3]) {
      if (isBlank(defined.get(level))) add("PRESSURE_UNDEFINED", `pressure level ${level} has no definition`);
    }
    for (const q of ws.questions) {
      if (q.status === "DRAFT") add("QUESTION_PENDING", `${q.qid} awaits faculty approval`);
      else if (isBlank(q.approved_by)) add("QUESTION_UNATTRIBUTED", `${q.qid} is approved by nobody named`);
      const s = states.get(q.state);
      if (!s || s.owner === SYSTEM || s.owner !== q.lens) add("QUESTION_MISPLACED", `${q.qid}: lens '${q.lens}' does not own state '${q.state}'`);
    }
    for (const s of ws.states) {
      if (s.owner === SYSTEM) continue;
      if (!ws.questions.some((q) => q.state === s.key && q.status === "APPROVED")) add("STATE_WITHOUT_QUESTION", `${s.key} has no approved question`);
    }
    const responses = new Map(ws.event_rules.map((r) => [r.event, r.response]));
    for (const event of MANDATORY_EVENTS) {
      if (isBlank(responses.get(event))) add("EVENT_RULE_MISSING", `rule '${event}' is missing or blank`);
    }
    const stops = new Map(ws.stop_conditions.map((s) => [s.key, s.text]));
    for (const key of MANDATORY_STOPS) {
      if (isBlank(stops.get(key))) add("STOP_CONDITION_MISSING", `stop condition '${key}' is missing or blank`);
    }
    const crit = ws.rubric.criteria;
    const total = crit.reduce((sum, c) => sum + c.weight_bp, 0);
    if (total !== WEIGHT_TOTAL_BP || crit.some((c) => !(c.weight_bp > 0))) {
      add("RUBRIC_WEIGHTS", `weights total ${total} basis points; they must be positive and total ${WEIGHT_TOTAL_BP}`);
    }
    for (const c of crit) {
      if (c.anchors.some(isBlank)) add("RUBRIC_ANCHOR_BLANK", `${c.key} has a blank level anchor`);
    }
    if (ws.rubric.status !== "APPROVED" || isBlank(ws.rubric.approved_by)) add("RUBRIC_PENDING", "the rubric awaits named faculty approval");
    return out;
  }

  // ---------- teaching profile: every field changes behavior ----------
  const startingPressure = (p) => (p.challenge_intensity <= 33 ? 1 : p.challenge_intensity <= 66 ? 2 : 3);
  const escalatesOnConfidence = (p) => p.evidence_strictness >= 50;

  // ---------- disclosed trigger rules (proposal p.22: "disclose the heuristic") ----------
  const EVIDENCE = /\b(?:table|figure|appendix|interview(?:s|ee|ees)?|survey item|joint display|cluster)\b|\b[rn]\s?=\s?[-.\d]|\bp\.\s?\d|\b\d+\s+(?:of|out of)\s+\d+\b/i;
  const words = (t) => new Set(t.toLowerCase().match(/[a-zÀ-ɏ']+/g) || []);
  function jaccard(a, b) {
    if (!a.size && !b.size) return 0;
    let shared = 0;
    for (const w of a) if (b.has(w)) shared++;
    return shared / (a.size + b.size - shared);
  }
  const DETECTORS = [
    { event: "answer_request", label: "Request for an answer or rewrite",
      rule: "write, rewrite, draft, give me, tell me what/the answer, what should I say, fix my/this/it, can you answer/say",
      test: (t) => /\b(?:(?:re)?write|draft|give me|tell me (?:what|the answer)|what should I say|fix (?:my|this|it)|can you (?:answer|say))\b/i.test(t) },
    { event: "causal_language", label: "Causal language from a cross-sectional design",
      rule: "improve, cause, lead(s) to, led to, drive(s), result(s) in, boost, increase, reduce, only when the dossier design is cross-sectional",
      test: (t, ctx) => ctx.design === "cross-sectional" && /\b(?:improv(?:e|es|ed|ing)|caus(?:e|es|ed|ing)|leads? to|led to|driv(?:e|es|en|ing)|results? in|boost(?:s|ed|ing)?|increas(?:e|es|ed|ing)|reduc(?:e|es|ed|ing))\b/i.test(t) },
    { event: "self_correction", label: "Candidate self-corrects",
      rule: "let me restate/revise/correct/rephrase, more precisely, I overstated, I should say/restate, to be accurate/precise, correct myself",
      test: (t) => /\b(?:let me (?:restate|revise|correct|rephrase)|more precisely|I overstated|I should (?:say|restate|rephrase)|to be (?:accurate|precise)|correct myself)\b/i.test(t) },
    { event: "high_confidence_low_evidence", label: "High confidence, low evidence",
      rule: "certainly, definitely, clearly, without (a) doubt, no question, I am confident/sure/certain, with no evidence marker",
      test: (t) => /\b(?:certainly|definitely|clearly|without (?:a )?doubt|no question|I am (?:confident|sure|certain))\b/i.test(t) && !EVIDENCE.test(t) },
    { event: "unsupported_claim", label: "Unsupported claim",
      rule: "always, never, all, every, prove(s), undeniably, obviously, with no evidence marker",
      test: (t) => /\b(?:always|never|all|every|proves?|undeniabl[ey]|obviously)\b/i.test(t) && !EVIDENCE.test(t) },
    { event: "evasion_repeat", label: "Evasion or repetition",
      rule: "as I (already) said, I already answered, next question, speaks for itself; or 60% word overlap with the previous turn",
      test: (t, ctx) => /\b(?:as I (?:already )?said|I already answered|next question|speaks? for (?:itself|themselves))\b/i.test(t) || (ctx.previous != null && jaccard(words(t), words(ctx.previous)) >= 0.6) },
  ];
  const EVIDENCE_RULE = "table, figure, appendix, interview(s), survey item, joint display, cluster, r = / n = followed by a number, p. followed by a number, 'k of n'";

  function detect(text, ctx) {
    const context = { design: ctx && ctx.design, previous: ctx && ctx.previous != null ? ctx.previous : null };
    return DETECTORS.filter((d) => d.test(text, context)).map((d) => d.event);
  }

  // ---------- dry run: the seven states, approved questions only ----------
  function selectQuestion(ws, stateKey, pressure, used) {
    const pool = ws.questions.filter((q) => q.state === stateKey && q.status === "APPROVED" && !used.has(q.qid));
    if (!pool.length) return { question: null, note: "" };
    const exact = pool.find((q) => q.pressure === pressure);
    if (exact) return { question: exact, note: "" };
    const below = pool.filter((q) => q.pressure < pressure).sort((a, b) => b.pressure - a.pressure)[0];
    const chosen = below || pool.slice().sort((a, b) => a.pressure - b.pressure)[0];
    const pending = ws.questions.find((q) => q.state === stateKey && q.pressure === pressure && q.status === "DRAFT");
    const why = pending ? `${pending.qid} (level ${pressure}) is pending approval` : `no approved question at level ${pressure}`;
    return { question: chosen, note: `${why}; using ${chosen.qid} (level ${chosen.pressure}).` };
  }

  function runDryRun(ws, script) {
    const profile = ws.profile;
    const rules = new Map(ws.event_rules.map((r) => [r.event, r.response]));
    const lensName = new Map(ws.lenses.map((l) => [l.key, l.name]));
    const steps = [];
    const preserved = [];
    const openObjections = [];
    const counts = {};
    let pressure = startingPressure(profile);
    let pendingClaim = null;
    const startPressure = pressure;

    ws.states.forEach((state, position) => {
      steps.push({ kind: "state", state: state.key, name: state.name, owner: state.owner, goal: state.goal, exit: state.exit });
      const turns = (script[state.key] || []).slice();
      if (state.owner === SYSTEM) {
        if (position === ws.states.length - 1) {
          steps.push({ kind: "system", speaker: "System",
            text: `Debrief. Claims preserved in both versions: ${preserved.length}. Open objections: ${openObjections.length}. Pressure ended at level ${pressure}. No grade is produced.` });
        } else {
          steps.push({ kind: "system", speaker: "System",
            text: "Orientation. This rehearsal uses a fictional dossier. It is not graded. Faculty can see the reasoning record; you can pause or stop at any time." });
        }
        turns.forEach((t) => steps.push({ kind: "candidate", speaker: "Candidate", text: t, events: [], pressure }));
        return;
      }
      const used = new Set();
      const ask = () => {
        const pick = selectQuestion(ws, state.key, pressure, used);
        if (!pick.question) return false;
        used.add(pick.question.qid);
        steps.push({ kind: "ask", speaker: lensName.get(state.owner) || state.owner, qid: pick.question.qid,
          text: pick.question.text, pressure, level: pick.question.pressure, note: pick.note });
        return true;
      };
      if (!ask()) {
        steps.push({ kind: "blocked", speaker: "Studio",
          text: `No approved question for ${state.name}. This state cannot run until faculty approve one.` });
        return;
      }
      let evasions = 0;
      let previous = null;
      turns.forEach((turn, i) => {
        const found = detect(turn, { design: ws.dossier.design, previous });
        const suppressed = [];
        let events = found;
        if (found.includes("self_correction") && found.includes("causal_language")) {
          // A restatement quotes the claim it retracts; the restatement rule wins.
          events = found.filter((e) => e !== "causal_language");
          suppressed.push("causal_language");
        }
        steps.push({ kind: "candidate", speaker: "Candidate", text: turn, events, suppressed, pressure });
        events.forEach((e) => { counts[e] = (counts[e] || 0) + 1; });
        const rule = (event, speaker, extra) => {
          const response = rules.get(event);
          if (isBlank(response)) return;
          steps.push({ kind: "rule", speaker, event, text: response + (extra ? ` ${extra}` : "") });
        };
        const owner = lensName.get(state.owner) || state.owner;
        let moveOn = false;
        if (events.includes("answer_request")) {
          rule("answer_request", owner);
        } else {
          if (events.includes("causal_language") && !isBlank(rules.get("causal_language"))) {
            rule("causal_language", lensName.get("methodologist") || owner);
            pendingClaim = { state: state.key, text: turn };
          }
          if (events.includes("self_correction")) {
            if (pendingClaim) {
              preserved.push({ original: pendingClaim.text, revised: turn, state: state.key });
              pendingClaim = null;
            }
            rule("self_correction", owner);
            moveOn = true;
          }
          if (events.includes("high_confidence_low_evidence")) {
            if (escalatesOnConfidence(profile) && pressure < 3) {
              pressure += 1;
              rule("high_confidence_low_evidence", owner, `Pressure is now level ${pressure}.`);
            } else if (escalatesOnConfidence(profile)) {
              rule("high_confidence_low_evidence", owner, "Pressure is already at level 3.");
            } else {
              steps.push({ kind: "note", speaker: "Studio", text: "Confident claim without evidence noted. Evidence strictness is below 50, so pressure does not rise." });
            }
          }
          if (events.includes("unsupported_claim")) rule("unsupported_claim", owner);
          if (events.includes("evasion_repeat")) {
            evasions += 1;
            if (evasions >= profile.evasions_before_reframe) {
              rule("evasion_repeat", owner);
              openObjections.push({ state: state.key, qid: [...used].pop() });
              evasions = 0;
              moveOn = true;
            } else {
              steps.push({ kind: "note", speaker: "Studio", text: `Evasion ${evasions} of ${profile.evasions_before_reframe} before the question is reframed.` });
            }
          }
          if (!events.length) steps.push({ kind: "note", speaker: "Studio", text: "The answer engages the question. No rule fires." });
        }
        if (moveOn && i < turns.length - 1) ask();
        previous = turn;
      });
    });
    return { steps, preserved, openObjections, counts, startPressure, finalPressure: pressure };
  }

    return FAIRNESS_PAIRS.map((pair) => {

  const DRY_RUN_SCRIPT = {

    method: [

  const U = "UNDETERMINED";
  const COHORT = [
    { candidate: "C-01", session: "S-01", end: "completed", events: { causal_language: 2, restated: 1, open_objections: 1 }, obs: {

    { candidate: "C-02", session: "S-02", end: "completed", events: { causal_language: 0, restated: 0, open_objections: 0 }, obs: {
      ownership: [3, "Named two rejected designs and what each would have let the study claim."],
      coherence: [2, "Held alignment from problem to implications under the Chair's narrowing question."],

    { candidate: "C-03", session: "S-03", end: "stopped", events: { causal_language: 0, restated: 0, open_objections: 0 }, obs: null },
    { candidate: "C-04", session: "S-04", end: "open", events: { causal_language: 3, restated: 0, open_objections: 2 }, obs: {

    for (const c of COHORT) {

          note_ref: storeContent(content, note), rater: "Rater A (fictional)",

  }

  root.StudioCore = {
    sha256Hex, canonical, digest, GENESIS, appendEntry, ledgerPayload, verifyLedgerPayload, contentHashOf,

<script>
(function () {
  "use strict";
  const S = globalThis.StudioCore;
  const KEY = "tactik-faculty-studio-v1";
  const TABS = [
    { id: "webscript", label: "Webscript" },
    { id: "triggers", label: "Trigger lab" },
    { id: "dryrun", label: "Dry run" },
    { id: "readiness", label: "Readiness" },
    { id: "controls", label: "Controls" },
    { id: "ledger", label: "Ledger" },
    { id: "boundaries", label: "Boundaries" },
  ];
  const LEVEL_NAMES = ["Not evident", "Emerging", "Defensible", "Strong"];
  const EVENT_LABELS = Object.fromEntries(S.DETECTORS.map((d) => [d.event, d.label]));

  // ---------- state ----------
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed && parsed.schema === 1 && parsed.webscript && parsed.ledger && Array.isArray(parsed.ledger.entries)) return parsed;
    } catch (err) { /* unreadable storage: start from the fixture */ }
    return null;
  }
  let state = load() || S.seedState("Faculty owner (demo)");
  const firstTab = (location.hash || "").replace("#", "");
  const ui = {
    tab: TABS.some((t) => t.id === firstTab) ? firstTab : "webscript",
    selected: null, flash: null, composite: false, confirmReset: false,
    eraseConfirm: null, ledgerFilter: "", pasteResult: null, jsonShown: null,
  };
  let saveTimer = null;
  function persist() {
    clearTimeout(saveTimer);
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (err) { /* storage refused */ }
  }
  // Typing is debounced; a ledger entry is written through at once, so closing

  function save() {

  }

  const ws = () => state.webscript;
  const isLocked = () => !!(state.locked && state.locked.version === state.webscript.version);
  const actor = () => (state.actor || "").trim();
  const now = () => new Date().toISOString();
  function record(kind, body) {
    S.appendEntry(state.ledger, kind, body);
    persist();
  }

  // ---------- DOM helper ----------
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const [key, value] of Object.entries(props)) {
        if (value === undefined || value === null || value === false) continue;
        if (key.startsWith("on") && typeof value === "function") el.addEventListener(key.slice(2), value);
        else if (key === "class") el.className = value;
        else if (key === "value") el.value = value;
        else if (key === "checked") el.checked = !!value;
        else if (value === true) el.setAttribute(key, "");
        else el.setAttribute(key, value);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid instanceof Node ? kid : String(kid));
    }
    return el;
  }
  const pill = (text, tone) => h("span", { class: `pill${tone ? ` pill--${tone}` : ""}` }, text);
  const short = (hex) => (hex ? `${hex.slice(0, 12)}…` : "");
  const pct = (bp) => `${Math.floor(bp / 100)}${bp % 100 ? `.${String(bp % 100).padStart(2, "0")}` : ""}%`;
  const vhead = (eyebrow, title, lede) => h("header", { class: "vhead" },
    h("div", { class: "vhead__eyebrow" }, eyebrow), h("h1", null, title), lede ? h("p", { class: "lede" }, lede) : null);
  const section = (title, note, ...body) => h("section", { class: "section" },
    h("div", { class: "section__head" }, h("h2", null, title)), note ? h("p", { class: "section__note" }, note) : null, ...body);

  function needActor() {
    if (actor()) return false;
    ui.flash = { tone: "bad", text: "Enter your name in 'Acting as' first. Approvals and overrides must name a person." };
    render();
    return true;
  }
  function flashBox() {
    if (!ui.flash) return null;
    const f = ui.flash;
    ui.flash = null;
    return f.tone === "bad"
      ? h("div", { class: "refusal", role: "alert" }, h("div", { class: "refusal__title" }, "Refused"), h("p", null, f.text))
      : h("div", { class: "ok-box", role: "status" }, h("div", { class: "ok-box__title" }, "Recorded"), h("p", null, f.text));
  }

  async function copyText(text, id) {
    try {
      await navigator.clipboard.writeText(text);
      ui.flash = { tone: "ok", text: "Copied to the clipboard." };
      ui.jsonShown = null;
    } catch (err) {
      ui.jsonShown = id;
      ui.flash = { tone: "ok", text: "The clipboard is not available here. The JSON is shown below; select it and copy." };
    }
    render();
  }

  // ---------- derived views of the ledger ----------
  function derive() {
    const sessions = new Map();
    const obs = new Map();
    const erased = new Set();
    const teaching = new Map();
    const reviews = new Map();
    const charter = [];
    for (const e of state.ledger.entries) {
      const b = e.body;
      switch (e.kind) {
        case "session_opened": sessions.set(b.session, { session: b.session, candidate: b.candidate, status: "open", condition: null, events: {} }); break;
        case "session_events": if (sessions.has(b.session)) sessions.get(b.session).events = b; break;
        case "session_completed": if (sessions.has(b.session)) sessions.get(b.session).status = "completed"; break;
        case "session_paused": if (sessions.has(b.session)) sessions.get(b.session).status = "paused"; break;
        case "session_resumed": if (sessions.has(b.session)) sessions.get(b.session).status = "open"; break;
        case "session_stopped":
          if (sessions.has(b.session)) Object.assign(sessions.get(b.session), { status: "stopped", condition: b.condition, stoppedBy: b.by });
          break;
        case "observation_recorded":
          obs.set(`${b.session}|${b.criterion}`, { session: b.session, candidate: b.candidate, criterion: b.criterion, level: b.level,
            note_ref: b.note_ref, rater: b.rater, index: e.index, hash: S.contentHashOf(e), original: b.level, overrides: [] });
          break;
        case "observation_overridden": {
          const o = obs.get(`${b.session}|${b.criterion}`);
          if (o) { o.level = b.to; o.overrides.push({ index: e.index, from: b.from, to: b.to, reason_ref: b.reason_ref, by: b.by, hash: S.contentHashOf(e) }); o.hash = S.contentHashOf(e); }
          break;
        }
        case "content_erased": erased.add(b.content_ref); break;
        case "teaching_action": teaching.set(b.draft_id, b); break;
        case "trigger_reviewed": reviews.set(b.fixture, b); break;
        case "charter_event": charter.push(Object.assign({ index: e.index }, b)); break;
        default: break;
      }
    }
    return { sessions, obs, erased, teaching, reviews, charter };
  }
  function contentText(ref, erased) {
    if (!ref) return null;
    if (erased.has(ref) || !state.content[ref]) return null;
    return state.content[ref].text;
  }

  // ---------- nav ----------
  function navCounts() {
    const blockers = S.lockBlockers(ws()).length;
    const d = derive();
    const stopped = [...d.sessions.values()].filter((s) => s.status === "stopped").length;
    const breaches = S.fairness(ws().dossier.design).filter((p) => p.breach).length;
    const verified = S.verifyLedgerPayload(S.ledgerPayload(state.ledger)).ok;
    return {
      webscript: isLocked() ? ["Locked", "ok"] : [`${blockers}`, blockers ? "warn" : "ok"],
      triggers: [`${breaches} breach${breaches === 1 ? "" : "es"}`, breaches ? "bad" : "ok"],
      readiness: [`${stopped} NO_SCORE`, stopped ? "warn" : ""],
      ledger: [`${state.ledger.entries.length}`, verified ? "" : "bad"],
    };
  }
  function renderNav() {
    const counts = navCounts();
    const nav = document.getElementById("nav");
    nav.replaceChildren(...TABS.map((t) => {
      const c = counts[t.id];
      return h("button", { type: "button", "aria-current": ui.tab === t.id ? "page" : null,
        onclick: () => { ui.tab = t.id; ui.selected = null; ui.composite = false; try { history.replaceState(null, "", `#${t.id}`); } catch (err) { /* sandboxed */ } render(); window.scrollTo(0, 0); } },
        h("span", null, t.label), c ? h("span", { class: `count${c[1] ? ` count--${c[1]}` : ""}` }, c[0]) : null);
    }));
  }

  // ---------- Webscript ----------
  function statusCard() {
    const w = ws();
    const blockers = S.lockBlockers(w);
    const locked = isLocked();
    const seal = S.digest(w);
    const groups = {};
    for (const b of blockers) (groups[b.code] = groups[b.code] || []).push(b.detail);
    return h("div", { class: "panel panel--status", id: "ws-status" },
      h("div", { class: "row" },
        h("h3", null, `Version ${w.version}`),
        locked ? pill("Locked", "ok") : pill("Draft", "draft"),
        w.supersedes ? h("span", { class: "small muted" }, `supersedes ${short(w.supersedes)}`) : null),
      h("dl", { class: "kv" },
        h("dt", null, locked ? "Seal" : "Seal if locked now"), h("dd", { class: "mono" }, seal),
        locked ? [h("dt", null, "Locked by"), h("dd", null, `${state.locked.by}, ${state.locked.at}`)] : null,
        h("dt", null, "Blockers"), h("dd", null, blockers.length ? `${blockers.length} must be resolved before locking` : "None. This script can be locked.")),
      !locked && blockers.length ? h("details", { open: true },
        h("summary", null, "What blocks the lock"),
        h("ul", { class: "plain small" }, Object.entries(groups).map(([code, details]) =>
          h("li", null, h("code", null, code), ` ${details.length > 1 ? `${details.length}× ` : ""}`, details.join("; "))))) : null,
      h("div", { class: "row" },
        locked
          ? h("button", { type: "button", class: "btn btn--primary", onclick: startNextVersion }, `Start version ${w.version + 1} draft`)
          : h("button", { type: "button", class: "btn btn--primary", onclick: lockWebscript }, "Lock this version"),
        h("button", { type: "button", class: "btn", onclick: () => copyText(JSON.stringify({ webscript: w, seal }, null, 2), "webscript") }, "Copy Webscript JSON")),
      ui.jsonShown === "webscript" ? h("textarea", { readonly: true, rows: 8, class: "mono", id: "ws-json", value: JSON.stringify({ webscript: w, seal }, null, 2) }) : null);
  }
  function refreshStatus() {
    const old = document.getElementById("ws-status");
    if (old) old.replaceWith(statusCard());
    renderNav();
  }
  function touched() { save(); refreshStatus(); }

  function lockWebscript() {
    const w = ws();
    const blockers = S.lockBlockers(w);
    if (blockers.length) {

    state.locked = { version: w.version, seal, by: actor(), at };

    save();
    render();
  }
  function startNextVersion() {
    const next = JSON.parse(JSON.stringify(ws()));

    const lensName = new Map(ws().lenses.map((l) => [l.key, l.name]));

      h("thead", null, h("tr", null, h("th", { class: "num" }, "#"), h("th", null, "State"), h("th", null, "Owner"), h("th", null, "Goal"), h("th", null, "Exit condition"))),
      h("tbody", null, ws().states.map((s, i) => h("tr", null,
        h("td", { class: "num" }, i + 1), h("td", null, s.name), h("td", null, s.owner === "system" ? "System" : lensName.get(s.owner) || s.owner),
        h("td", null, s.goal), h("td", null, s.exit))))));
  }

  function pressureView() {
    return h("div", { class: "grid3" }, ws().pressure_levels.map((p) => {
      const id = `pressure-${p.level}`;
      return h("div", { class: "stack" },
        h("label", { class: "field", for: id }, h("span", null, `Level ${p.level}`),
          h("textarea", { id, rows: 4, disabled: isLocked(), value: p.definition, placeholder: "Not yet defined by faculty",
            oninput: (e) => { p.definition = e.target.value; touched(); } })),
        !isLocked() && !p.definition.trim() ? h("button", { type: "button", class: "btn", onclick: () => { p.definition = S.PRESSURE_SUGGESTIONS[p.level]; save(); render(); } }, "Start from TACTIK's suggestion") : null);
    }));
  }

  function questionRow(q) {
    const w = ws();
    const locked = isLocked();

          h("select", { id: "ledger-filter", onchange: (e) => { ui.ledgerFilter = e.target.value; render(); } },
            h("option", { value: "" }, "all kinds"), kinds.map((k) => h("option", { value: k, selected: ui.ledgerFilter === k }, k))))),
      h("div", { class: "tablewrap" }, h("table", null,
        h("thead", null, h("tr", null, h("th", { class: "num" }, "#"), h("th", null, "Kind"), h("th", null, "What it says"), h("th", null, "Link"))),
        h("tbody", null, shown.slice().reverse().map((e) => h("tr", null,
          h("td", { class: "num" }, e.index), h("td", null, h("code", null, e.kind)), h("td", null, summary(e)), h("td", { class: "mono" }, short(e.link))))))),
      section("Content store", `Candidate and rater text lives here, outside the chain: ${refs.length} item${refs.length === 1 ? "" : "s"} stored, ${d.erased.size} erased. An entry body holds only the salted hash.`,
        h("p", { class: "small muted" }, "Erase text from the readiness view. Erasing removes the text and its salt from this browser and appends a content_erased entry. The chain still verifies.")),
      section("Check a ledger someone sent you", "Paste a ledger JSON. This uses the page's own implementation of docs/HASHING.md. For an independent check, use the repository commands above.",
        h("textarea", { id: "paste-ledger", rows: 5, class: "mono", placeholder: "{\"head\": \"…\", \"entries\": [ … ]}" }),
        h("div", { class: "row" }, h("button", { type: "button", class: "btn", onclick: () => {
          const raw = document.getElementById("paste-ledger").value;
          try { ui.pasteResult = S.verifyLedgerPayload(JSON.parse(raw)); } catch (err) { ui.pasteResult = { ok: false, problems: [`not valid JSON: ${err.message}`], head: "", count: 0 }; }
          render();
        } }, "Verify")),
        ui.pasteResult ? (ui.pasteResult.ok
          ? h("div", { class: "ok-box" }, h("div", { class: "ok-box__title" }, "Verifies"), h("p", { class: "mono" }, `${ui.pasteResult.count} entries · head ${ui.pasteResult.head}`))
          : h("div", { class: "refusal" }, h("div", { class: "refusal__title" }, "Does not verify"), h("ul", { class: "plain small" }, ui.pasteResult.problems.map((p) => h("li", null, p))))) : null),
      section("Reset this demo", "Discards this browser's copy, ledger included, and reloads the fixture. A real deployment has no such control; this exists because the data here is fictional.",
        ui.confirmReset
          ? h("div", { class: "row" },
            h("span", { class: "small", style: "color: var(--crimson)" }, `This discards ${state.ledger.entries.length} entries. Head before reset: ${short(payload.head)}`),
            h("button", { type: "button", class: "btn btn--danger", onclick: () => { state = S.seedState(state.actor); ui.confirmReset = false; ui.flash = { tone: "ok", text: "The demo was reset to the fixture." }; save(); render(); } }, "Discard and reload"),
            h("button", { type: "button", class: "btn", onclick: () => { ui.confirmReset = false; render(); } }, "Keep"))
          : h("div", { class: "row" }, h("button", { type: "button", class: "btn btn--danger", onclick: () => { ui.confirmReset = true; render(); } }, "Reset demo"))));
  }

  // ---------- Boundaries ----------
  function viewBoundaries() {
    return h("div", { class: "view" },
      vhead("What this tool is, and is not", "Boundaries",
        "TACTIK challenges, checks and tracks. It does not write, complete, submit or grade student work, and it does not imitate a real person."),
      h("div", { class: "grid2" },
        h("div", { class: "panel" }, h("h3", null, "Faculty can"),
          h("ul", { class: "plain small" },
            h("li", null, "Approve, edit or reject every question, with the reason recorded"),
            h("li", null, "Define what each pressure level means"),
            h("li", null, "Version-lock a script so every session can prove which script it ran"),
            h("li", null, "Validate each trigger against fixtures and style pairs"),
            h("li", null, "Override any observation, with the original kept"),
            h("li", null, "Pause or stop any session; a stop voids it"),
            h("li", null, "Erase candidate text while keeping the record verifiable"))),
        h("div", { class: "panel" }, h("h3", null, "The studio never"),
          h("ul", { class: "plain small" },
            h("li", null, "Produces a grade, a total, or a predicted grade"),
            h("li", null, "Lets an unapproved question reach a candidate"),
            h("li", null, "Edits or deletes a ledger entry"),
            h("li", null, "Calls an AI model or sends anything over the network"),
            h("li", null, "Uses a real person's name, voice, likeness or biography"),
            h("li", null, "Carries an institution's name or logo without written permission")))),
      section("Data in this demo", null,
        h("div", { class: "tablewrap" }, h("table", null,
          h("thead", null, h("tr", null, h("th", null, "What"), h("th", null, "Where it is"), h("th", null, "Status"))),
          h("tbody", null,

            h("tr", null, h("td", null, "Your approvals and overrides"), h("td", null, "This browser's local storage"), h("td", null, "Lost if site data is cleared")),
            h("tr", null, h("td", null, "Network"), h("td", null, "Font stylesheet only"), h("td", null, "No AI call, no analytics, no upload"))))),
        h("p", { class: "small muted" }, "Real candidate data needs a server, roles, a written data agreement, and the institution's IRB or institutional determination first (proposal p.17). Nothing on this page is that.")),
      section("What this does not establish", null,
        h("ul", { class: "plain" },
          h("li", null, "That rehearsal improves defense performance. Only the pilot's measures can show that (RQ1–RQ3, p.19)."),
          h("li", null, "That the disclosed trigger rules are adequate. The trigger lab shows they are not yet: they miss paraphrase and react to phrasing."),
          h("li", null, "That the levels mean the same thing across criteria. No calibration has been done, which is why no composite exists."),
          h("li", null, "Compliance with FERPA or any institutional policy. Browser-only fictional data proves nothing about that."))));
  }

  // ---------- render ----------
  function render() {
    const y = window.scrollY;
    const views = { webscript: viewWebscript, triggers: viewTriggers, dryrun: viewDryRun, readiness: viewReadiness, controls: viewControls, ledger: viewLedger, boundaries: viewBoundaries };
    let node;
    try {
      node = views[ui.tab]();
    } catch (err) {
      node = h("div", { class: "refusal" }, h("div", { class: "refusal__title" }, "This view failed"), h("p", null, err.message));
    }
    document.getElementById("view").replaceChildren(node);
    const check = S.verifyLedgerPayload(S.ledgerPayload(state.ledger));
    document.getElementById("alarm").replaceChildren(check.ok ? "" : h("div", { class: "alarm", role: "alert" },
      h("strong", null, "This browser's ledger no longer verifies. "), "Someone or something edited stored entries. The studio will not repair it; see the Ledger view."));
    renderNav();
    window.scrollTo(0, y);
  }

  const actorInput = document.getElementById("actor");
  actorInput.value = state.actor || "";
  actorInput.addEventListener("input", (e) => { state.actor = e.target.value; save(); });
  window.addEventListener("hashchange", () => {
    const t = (location.hash || "").replace("#", "");
    if (TABS.some((x) => x.id === t) && t !== ui.tab) { ui.tab = t; render(); }
  });
  render();
  save();
})();
</script>
